<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #111;
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .section {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-top: 0;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      padding: 20px;
      background: #111;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hei, jeg er Hedda Sundby</h1>
    <p>Utvikler • Designer • Skaper</p>
  </header>

  <div class="section">
    <h2>Prosjekter</h2>
    <div class="projects">
      <div class="card">
        <h3>Prosjekt 1</h3>
        <p>Kort beskrivelse av prosjektet ditt.</p>
      </div>
      <div class="card">
        <h3>Prosjekt 2</h3>
        <p>Kort beskrivelse av prosjektet ditt.</p>
      </div>
      <div class="card">
        <h3>Prosjekt 3</h3>
        <p>Kort beskrivelse av prosjektet ditt.</p>
      </div>
    </div>
  </div>

  <footer>
    © 2024 [Ditt Navn]
  </footer>
</body>
</html>
